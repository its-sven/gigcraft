[package]
name = "gigcraft-ffi"
description = "GigCraft core for Swift and Kotlin (UniFFI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "gigcraft_ffi"

[dependencies]
gigcraft-model.workspace = true
gigcraft-chordpro.workspace = true
gigcraft-store.workspace = true
gigcraft-commands.workspace = true
gigcraft-rig.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[dev-dependencies]
tempfile.workspace = true

# UniFFI's generated scaffolding needs `unsafe`, so this crate keeps its own lints.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
