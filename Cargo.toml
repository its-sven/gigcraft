[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop", "tools/gigcraft-bindgen", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/its-sven/gigcraft"

[workspace.dependencies]
gigcraft-model = { path = "crates/gigcraft-model" }
gigcraft-chordpro = { path = "crates/gigcraft-chordpro" }
gigcraft-formats = { path = "crates/gigcraft-formats" }
gigcraft-store = { path = "crates/gigcraft-store" }
gigcraft-commands = { path = "crates/gigcraft-commands" }
gigcraft-perform = { path = "crates/gigcraft-perform" }
gigcraft-rig = { path = "crates/gigcraft-rig" }
gigcraft-automation = { path = "crates/gigcraft-automation" }
gigcraft-ui-egui = { path = "crates/gigcraft-ui-egui" }
gigcraft-midi = { path = "crates/gigcraft-midi" }
gigcraft-live = { path = "crates/gigcraft-live" }
gigcraft-live-net = { path = "crates/gigcraft-live-net" }
gigcraft-audio = { path = "crates/gigcraft-audio" }
gigcraft-audio-cpal = { path = "crates/gigcraft-audio-cpal" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
unicode-normalization = "0.1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
chordsketch-chordpro = "=0.9.1"
uniffi = "0.32"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
rfd = "0.15"
midir = "0.11"
cpal = "0.18"

# craft-libs has no release tag yet; pin one commit for every craft crate.
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
craft-mcp = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
craft-audio-dsp = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
