[package]
name = "gigcraft-bindgen"
description = "uniffi-bindgen for GigCraft (used by `cargo xtask apple`)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
