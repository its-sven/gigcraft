name: Desktop packages

# Every push to main: the desktop app for macOS, Windows and Linux as
# downloads of the run. A v* tag: the same files on the GitHub release
# (the iOS IPA joins them from the CI workflow).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libasound2-dev
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo xtask package --build ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: GigCraft-${{ matrix.name }}-${{ github.run_number }}
          path: dist/*
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease \
            || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
