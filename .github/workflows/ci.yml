name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for the desktop app
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libasound2-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask ci
        run: cargo xtask ci

  apple:
    name: iOS app
    runs-on: macos-latest
    permissions:
      contents: write # attach the IPA to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Core as XCFramework + Swift bindings
        run: cargo xtask apple
      - name: Xcode project
        run: brew install xcodegen && cd apps/apple && xcodegen
      - name: Build for the simulator
        run: |
          cd apps/apple
          xcodebuild -project GigCraft.xcodeproj -scheme GigCraft \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      # An unsigned IPA for sideloading (SideStore, AltStore, Sideloadly sign it
      # with your own Apple ID when installing). The build number counts CI runs,
      # so the installer sees every build as an update.
      - name: Build for devices (unsigned IPA)
        if: github.event_name == 'push'
        run: |
          cd apps/apple
          xcodebuild -project GigCraft.xcodeproj -scheme GigCraft -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir -p ipa/Payload
          cp -R build-device/Build/Products/Release-iphoneos/GigCraft.app ipa/Payload/
          cd ipa && zip -qr "GigCraft-${{ github.run_number }}.ipa" Payload
      - name: Keep the IPA with this run
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: GigCraft-ipa-${{ github.run_number }}
          path: apps/apple/ipa/GigCraft-*.ipa
          retention-days: 30
      - name: Attach the IPA to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease \
            || true
          gh release upload "$GITHUB_REF_NAME" apps/apple/ipa/GigCraft-*.ipa --clobber
